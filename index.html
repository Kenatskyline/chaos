<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravens Nest Chaos</title>

<style>
body {
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial, sans-serif;
  text-align:center;
}

h1 {
  margin-top:20px;
  letter-spacing:6px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:20px;
  padding:20px;
  max-width:600px;
  margin:auto;
}

.disc {
  width:100%;
  aspect-ratio:1/1;
  perspective:1000px;
}

.inner {
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition: transform 0.5s ease;
}

.disc.flipped .inner {
  transform: rotateY(180deg);
}

.face {
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:50%;
}

.front img {
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

.back {
  transform: rotateY(180deg);
  background:#f3e6c9;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  border-radius:50%;
}

.chaos {
  font-family: "Comic Sans MS", cursive;
  font-size:20px;
  color:black;
  transform:rotate(-5deg);
  text-align:center;
}

.error {
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  background:#222;
  border-radius:50%;
  font-size:12px;
}

button {
  padding:12px 20px;
  margin:20px;
  border:none;
  border-radius:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>CHAOS</h1>

<div class="grid" id="grid"></div>

<button onclick="reset()">RESET</button>

<script>

// 🔥 Chaos list
const chaosList = [
"WEIGHTED VEST",
"CURSED CROWN",
"PLANK PRISON",
"WEAK HAND",
"SUICIDE SPRINT",
"DOUBLE OR NOTHING"
];

// 🔥 MULTI-PATH IMAGE LOADER (this is the fix)
function getImage(i){
  const paths = [
    `discs/disc${i}.png`,
    `/chaos/discs/disc${i}.png`,
    `./discs/disc${i}.png`
  ];
  return paths;
}

const grid = document.getElementById("grid");

function build(){
  grid.innerHTML = "";

  for(let i=1;i<=6;i++){

    let disc = document.createElement("div");
    disc.className="disc";

    let inner = document.createElement("div");
    inner.className="inner";

    // FRONT
    let front = document.createElement("div");
    front.className="face front";

    let img = document.createElement("img");
    let paths = getImage(i);
    let attempt = 0;

    img.src = paths[attempt] + "?v=" + Date.now();

    img.onerror = () => {
      attempt++;
      if(attempt < paths.length){
        img.src = paths[attempt] + "?v=" + Date.now();
      } else {
        front.innerHTML = `<div class="error">disc${i}.png not found</div>`;
      }
    };

    front.appendChild(img);

    // BACK
    let back = document.createElement("div");
    back.className="face back";

    let chaosDiv = document.createElement("div");
    chaosDiv.className="chaos";

    back.appendChild(chaosDiv);

    inner.appendChild(front);
    inner.appendChild(back);
    disc.appendChild(inner);

    disc.onclick = () => flip(disc);

    grid.appendChild(disc);
  }
}

function flip(disc){
  if(disc.classList.contains("flipped")) return;

  let chaos = chaosList[Math.floor(Math.random()*chaosList.length)];
  disc.querySelector(".chaos").innerText = chaos;

  disc.classList.add("flipped");
}

function reset(){
  document.querySelectorAll(".disc").forEach(d=>{
    d.classList.remove("flipped");
    d.querySelector(".chaos").innerText="";
  });
}

build();
</script>

</body>
</html>
