<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravens Nest Chaos</title>

<style>
body {
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family: Arial, Helvetica, sans-serif;
  text-align:center;
}

h1 {
  margin-top:20px;
  letter-spacing:6px;
}

.subtitle {
  color:#aaa;
  margin-bottom:10px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:20px;
  padding:20px;
  max-width:600px;
  margin:auto;
}

.disc {
  width:100%;
  aspect-ratio:1/1;
  perspective:1000px;
}

.inner {
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition: transform 0.5s ease;
}

.disc.flipped .inner {
  transform: rotateY(180deg);
}

.face {
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:50%;
  overflow:hidden;
}

.front img {
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.back {
  transform: rotateY(180deg);
  background:#f3e6c9;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  border-radius:50%;
}

.chaos {
  font-family: Impact, "Arial Black", sans-serif;
  font-size:22px;
  color:black;
  text-align:center;
}

button {
  padding:12px 20px;
  margin:20px;
  border:none;
  border-radius:20px;
  font-weight:bold;
}

.status {
  color:#bbb;
}
</style>
</head>

<body>

<h1>CHAOS</h1>
<div class="subtitle">Pick a disc. Color means nothing. Chaos is true random.</div>

<div class="grid" id="grid"></div>

<button onclick="reset()">RESET</button>

<div class="status" id="status">Mercy or chaos?</div>

<script>

// 🔥 Chaos list
const chaosList = [
"WEIGHTED VEST",
"CURSED CROWN",
"PLANK PRISON",
"WEAK HAND THROW",
"SUICIDE SPRINT",
"DOUBLE OR NOTHING"
];

// ✅ CORRECT PATH (ROOT)
const images = [
"/discs/disc1.png",
"/discs/disc2.png",
"/discs/disc3.png",
"/discs/disc4.png",
"/discs/disc5.png",
"/discs/disc6.png"
];

const grid = document.getElementById("grid");
const statusText = document.getElementById("status");

function build(){
  grid.innerHTML = "";

  for(let i=0;i<6;i++){
    let disc = document.createElement("div");
    disc.className="disc";

    disc.innerHTML = `
      <div class="inner">
        <div class="face front">
          <img src="${images[i]}" alt="disc">
        </div>
        <div class="face back">
          <div class="chaos"></div>
        </div>
      </div>
    `;

    disc.onclick = () => flip(disc);
    grid.appendChild(disc);
  }
}

function flip(disc){
  if(disc.classList.contains("flipped")) return;

  let chaos = chaosList[Math.floor(Math.random()*chaosList.length)];
  disc.querySelector(".chaos").innerText = chaos;

  disc.classList.add("flipped");

  statusText.innerText = chaos + " has been sentenced.";
}

function reset(){
  document.querySelectorAll(".disc").forEach(d=>{
    d.classList.remove("flipped");
    d.querySelector(".chaos").innerText="";
  });

  statusText.innerText = "Mercy or chaos?";
}

build();
</script>

</body>
</html>
